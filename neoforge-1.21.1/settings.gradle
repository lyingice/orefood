pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// 让 Gradle 能自动下载缺失的 JDK（本构建需要 Java 21 工具链）。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'template-neoforge-1.21.1'
