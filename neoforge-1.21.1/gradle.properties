org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Parchment 提供更好的参数名与 Javadoc（可选，官方 MDK 默认开启）。
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## ---- 环境版本 ----

# Minecraft 版本必须与 NeoForge 版本匹配，否则取不到有效 artifact。
minecraft_version=1.21.1
# 只声明 1.21.1。写成 [1.21.1, 1.22) 会让 Modrinth 展开成 1.21.1~1.21.8+，
# 但 1.21.2 起的 NeoForge 是另一条版本线，1.21.4 更是整体重写了物品模型系统，
# 本 jar 在那上面用不了。
minecraft_version_range=[1.21.1,1.21.2)
# 最新版本见 https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.250
neo_version_range=[21.1.0,)
# 对加载器（FML）主版本的要求。
loader_version_range=[4,)

# KubeJS：只用于编译「矿物牛排物品类型」插件；不进 jar、不构成依赖。
# 版本号写死 build 号——KubeJS 迭代很快，写区间容易误配。
# 联动模组：只用于编译期引用 API / 记录语言键约定，不进 jar、不构成硬依赖。
# 对应版本 3.0.9+mc1.21；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
appleskin_version=uAKA6Laj
# 对应版本 21.1.11；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
enchantment_descriptions_version=IktklYWh
# Enchantment Descriptions 的前置。
# 对应版本 21.0.66+neoforge-1.21.1；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
balm_version=CquiaiDj
# Enchantment Descriptions 的另一个前置（Bookshelf）。
# 对应版本 21.1.81；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
bookshelf_version=1sdJl7J1
# Bookshelf 21.x 自己依赖的库（NeoForge 专有；1.20.1 没有这个前置）。
# 对应版本 21.1.11
prickle_version=EE1FHDyD

kubejs_version=2101.7.2-build.379

## ---- 前置模组（示例，按需启用）----
# 声明对其它模组的运行期依赖时，在这里写下界版本区间。
# 只写下界即可：上游保持向后兼容时，写死小版本会在对方更新后误报「缺少前置」。
# 这些属性会被 processResources / generateModMetadata 展开进元数据文件，
# 再由 Modrinth / CurseForge 读走用于依赖解析，因此格式必须合法（如 [1.0.0,) ）。
#example_mod_version_range=[1.0.0,)

## ---- 模组属性 ----
# 必须与 OreFoodConstants.MOD_ID 及各元数据文件中的 modId 一致。
mod_id=orefood
mod_name=Ore Food
mod_license=MIT
mod_version=2.1.0
mod_group_id=com.lyingice.orefood
mod_authors=LyingIce
mod_description=50 ore foods (5 minerals x 10 foods) with durability and five food enchantments.
