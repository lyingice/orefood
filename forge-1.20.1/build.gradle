plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

// 产物命名：orefood-forge-1.20.1-1.0.0.jar —— modid - 加载器 - MC 版本 - 模组版本。
// 三个模块的 jar 经常并排放（发布 / 上传平台），带上加载器与 MC 版本才能一眼分辨。
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// 1.18 起 Mojang 向终端用户下发 Java 17，因此本构建面向 Java 17。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ---------------------------------------------------------------------------
// 共享源码层：把 ../common 直接作为源码目录编译进本 jar。
// 不打包 jarJar / Shadow —— common 是纯逻辑，直接参与编译即可，
// 任何一边编译失败都会立刻暴露共享层的问题。
// ---------------------------------------------------------------------------
sourceSets.main.java.srcDir '../common/src/main/java'

// 共享资源层：语言文件等平台无关资源由三个模块打包同一份，
// 避免同一条文案要在三个地方各改一遍。
sourceSets.main.resources.srcDir '../common/src/main/resources'

// ---------------------------------------------------------------------------
// Mixin 的 refmap：**生产环境（SRG 名）下的命根子**。
//
// 注解里写的是 Mojang 名（eat / apply / assemble），而 1.20.1 的正式客户端里这些
// 方法叫 SRG 名（m_21063_ ...）。把 Mojang 名翻译过去靠的就是 refmap：由 Mixin
// 注解处理器在编译期生成，必须打进 jar，并在 orefood.mixins.json 里声明。
//
// **dev 运行永远看不出来**：runClient / runServer 用的是 Mojang 名，注解直接匹配成功。
// 缺 refmap 的症状是「编译过、dev 正常、一打进 jar 就 InvalidInjectionException:
// ... could not find any targets matching 'eat(...)'」，而且因为 config 是 required，
// 游戏直接起不来。见 AGENT.md 踩坑清单第 18 条。
// ---------------------------------------------------------------------------
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // 让 IDE 在启动游戏前先执行 processResources。
    copyIdeResources = true

    runs {
        // 注意：ForgeGradle 6 没有 ModDevGradle 的 ideName 等价物。IDEA 里的运行配置名
        // 由 taskName 派生（"run" + 首字母大写的 run 名），因此这里是固定的
        // runClient / runServer / runData；而 run 名又必须保持 client / server / data
        // 才能匹配 userdev 的 run type（改名会找不到 run type）。
        // 想在 IDEA 里看到 "Client-1.20" 这类名字，只能在生成后手动 Rename。
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            // 数据生成使用独立的工作目录
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// 包含数据生成器产出的资源。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------------------
// 测试源集：仅供开发期验证，**不进入发布 jar**。
//
// jar 任务只打 sourceSets.main.output，测试产物天然不会被打包；
// 这里额外把 ../common/src/test/java 并进来，让共享层的测试在三个平台上各跑一遍
// （与 main 的共享方式对称，测试代码也享受同一份多重校验）。
// ---------------------------------------------------------------------------
sourceSets.test.java.srcDir '../common/src/test/java'

repositories {
    // MixinGradle 会往 annotationProcessor 里加 org.spongepowered:mixin:...:processor，
    // 那个坐标只在 Sponge 仓库里。
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    // KubeJS 的官方 maven。
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    // KubeJS 的传递依赖（architectury / rhino 等）：fg.deobf 解析 POM 时会去找它们。
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    // KubeJS 的运行期依赖 animated-gif-lib 来自 JitPack（只有 dev 里启用 localRuntime 时才需要）。
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
    mavenCentral()
}

dependencies {
    // 指定使用的 Minecraft + Forge 版本。ForgeGradle 会自行拉取 userdev 并完成配置。
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin 注解处理器：编译期把注解里的 Mojang 名写成 refmap（由上面的 mixin 块
    // 指定输出文件名并打进 jar）。ForgeGradle 6 不会自动加，漏了它 refmap 就永远不生成，
    // 而 dev 运行又完全看不出来——症状见上面 mixin 块的注释。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // KubeJS 只用于**编译**那个物品类型插件（OreFoodKubeJSPlugin / OreFoodItemBuilder）：
    // 没装 KubeJS 时 kubejs.plugins.txt 不会被读取，那两个类也就不会被加载。
    // 1.20.1 是 SRG 环境所以 KubeJS 本体需要 fg.deobf。
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    // 还要单独补 rhino：KubeJS 的 RegistryInfo 实现了 rhino 的 TypeWrapperFactory，
    // 而 rhino 不在 KubeJS 的传递依赖里，少了它 javac 会报「无法访问 TypeWrapperFactory」。
    // 这里只需要类型在场，不调用它的成员，所以不必 deobf。
    compileOnly "dev.latvian.mods:rhino-forge:${rhino_version}"

    // 测试只依赖 JUnit —— 共享层是纯 JDK，可以脱离 Minecraft 运行。
    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// 展开元数据文件中的占位符。
// 注意：Groovy 的 expand 对美元符号敏感，模板里不要出现裸的美元符号。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// dev 运行（runServer / runClient）加载的是 build/resources/main 这个**目录**，
// 而不是 jar。而 Mixin 只从「mod 文件」根部的 META-INF/MANIFEST.MF 里读 MixinConfigs
// ——目录形式的 mod 文件同样如此。只把清单设在 jar 任务上，本地测试时 Mixin 配置
// 就**根本不会被加载**，症状是 mixin 静默失效（编译通过、启动不报错、功能不起作用），
// 只有真正打进 jar 才生效。
//
// 这里在 resources 输出目录里补一份最小清单专门给 dev 用；jar 的清单由 jar 任务
// 自己生成，两者互不干扰（下面 jar 任务里排除了这份，避免重复条目）。
//
// 注意：路径与 mod_id 都必须在闭包**外面**取好。doLast 闭包的委托是任务对象，
// 里面既看不到 destinationDirectory（ProcessResources 上没这个属性），
// 也不便访问脚本变量。
def devManifestFile = layout.buildDirectory.file('resources/main/META-INF/MANIFEST.MF')
def devMixinConfigs = "${mod_id}.mixins.json"

tasks.named('processResources', ProcessResources).configure {
    doLast {
        def target = devManifestFile.get().asFile
        target.parentFile.mkdirs()
        target.text = "Manifest-Version: 1.0\r\nMixinConfigs: ${devMixinConfigs}\r\n\r\n"
    }
}

tasks.named('jar', Jar).configure {
    // processResources 往输出目录里塞了一份给 dev 用的清单，jar 里不要它
    // ——jar 有自己的清单（见下面的 manifest 块），重复条目会让打包失败。
    exclude 'META-INF/MANIFEST.MF'

    manifest {
        attributes([
                // Mixin 配置必须在 JAR 清单里声明。
                // Forge 1.20.1 的 mods.toml **不支持** [[mixins]] 字段（写了会被静默忽略，
                // 官方 1.20.1 的元数据文档里也没有它），等价手段就是清单属性 MixinConfigs
                // —— Mixin 自带的 MixinPlatformAgentDefault 会读它。
                // 而 NeoForge 那边恰恰相反：必须在 neoforge.mods.toml 里写 [[mixins]]。
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // 这是重新混淆 jar 的推荐做法。
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
