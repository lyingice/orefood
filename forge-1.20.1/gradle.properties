org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
# 只声明 1.20.1：这个范围会被 Modrinth 展开成"支持的 MC 版本列表"，
# 写成 [1.20.1,1.21) 会让平台显示支持 1.20.1~1.20.6，
# 而 1.20.2+ 换了 Forge 版本线、1.20.5+ 更是另一套加载器，本 jar 用不了。
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.5
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# KubeJS：只用于编译「矿物牛排物品类型」插件；不进 jar、不构成依赖。
# 版本号写死 build 号——KubeJS 迭代很快，写区间容易误配。
kubejs_version=2001.6.5-build.26
# KubeJS 的脚本引擎，插件类编译时需要它（见 build.gradle 注释）。
rhino_version=2001.2.3-build.10

## ---- 前置模组（示例，按需启用）----
# 声明对其它模组的运行期依赖时，在这里写下界版本区间。
# 只写下界即可：上游保持向后兼容时，写死小版本会在对方更新后误报「缺少前置」。
# 这些属性会被 processResources / generateModMetadata 展开进元数据文件，
# 再由 Modrinth / CurseForge 读走用于依赖解析，因此格式必须合法（如 [1.0.0,) ）。
#example_mod_version_range=[1.0.0,)

mod_id=orefood
mod_name=Ore Food
mod_license=MIT
mod_version=2.0.0
mod_group_id=com.lyingice.orefood
mod_authors=LyingIce
mod_description=Data-driven ore beef with custom food enchantments.
