pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

// 本模块需要 Java 25 工具链；由 foojay 自动下载缺失的 JDK。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'orefood-neoforge-26.1.2'
