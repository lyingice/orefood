org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)
neo_version=26.1.2.109
neo_version_range=[26.1.2.0,)
loader_version_range=[11,)

# KubeJS：只用于编译「矿物牛排物品类型」插件；不进 jar、不构成依赖。
# 联动模组：只用于编译期引用 API / 记录语言键约定，不进 jar、不构成硬依赖。
# 对应版本 3.0.9+mc26.1；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
appleskin_version=i8MiVItH
# 对应版本 26.1.2.6；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
enchantment_descriptions_version=MMZecuPQ
# Enchantment Descriptions 的前置。
# 对应版本 26.1.2.15+neoforge-26.1.2；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
balm_version=FgDdQRa6
# Enchantment Descriptions 的另一个前置（Bookshelf）。
# 对应版本 26.1.2.15；用 Modrinth 的 version id 指定，避免多加载器共用版本号时取错文件
bookshelf_version=YuP6ZYfM
# Bookshelf 21.x 自己依赖的库（NeoForge 专有；1.20.1 没有这个前置）。
# 对应版本 26.1.2.6
prickle_version=FzfKD3xX

kubejs_version=26.1.2-8.0.6

## ---- 前置模组（示例，按需启用）----
# 声明对其它模组的运行期依赖时，在这里写下界版本区间。
# 只写下界即可：上游保持向后兼容时，写死小版本会在对方更新后误报「缺少前置」。
# 这些属性会被 processResources / generateModMetadata 展开进元数据文件，
# 再由 Modrinth / CurseForge 读走用于依赖解析，因此格式必须合法（如 [1.0.0,) ）。
#example_mod_version_range=[1.0.0,)

mod_id=orefood
mod_name=Ore Food
mod_license=MIT
mod_version=2.1.0
mod_group_id=com.lyingice.orefood
mod_authors=LyingIce
mod_description=50 ore foods (5 minerals x 10 foods) with durability and five food enchantments.
