modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 本模组默认按双端模组处理。
# 若 orefood 将来变成纯客户端模组（只在客户端有实际作用），打开下面这行：
# NeoForge 1.21 起移除了 Forge 的 clientSideOnly，等价手段就是让加载器忽略版本比对，
# 这样客户端装了、服务端没装时不会被判成「模组列表不匹配」而拒绝联机。
#displayTest="IGNORE_ALL_VERSION"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="orefood.png"
# Mixin 配置：NeoForge 在元数据里声明。
# 注意 Forge 1.20.1 的 mods.toml **不支持** [[mixins]]（写了会被静默忽略），
# 那边必须改用 JAR 清单的 MixinConfigs 属性——见 forge-1.20.1/build.gradle。
# 配置文件本身放在 src/main/resources/${mod_id}.mixins.json。
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ---- 前置依赖示例（按需启用）----
# NeoForge 用 type 字段取代了 Forge 的 mandatory：required / optional / incompatible。
# side="CLIENT" 表示「只要求客户端安装该前置」：当被依赖的模组自己是纯客户端模组时，
# 这里必须写 CLIENT —— 写成 "BOTH" 会让专用服务端因「缺少前置」而拒绝启动。
#
#[[dependencies.${mod_id}]]
#    modId="example_mod"
#    type="required"
#    versionRange="[1.0.0,)"
#    ordering="NONE"
#    side="BOTH"
