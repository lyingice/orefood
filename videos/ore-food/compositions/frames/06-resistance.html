  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.6s) - the resistance icon thrusts in from above; the effect is named,
         then its level is nailed: box, numeral, then the pin rule + nail head. */
      tl.fromTo(".f06-resistance-herobox",
        { opacity: 0, y: -78, scale: 1.18, transformOrigin: "50% 50%" },
        { opacity: 1, y: 0, scale: 1, duration: 0.64, ease: "power3.out" }, 0.1);
      tl.fromTo(".f06-resistance-name", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);
      tl.fromTo(".f06-resistance-tagbox",
        { opacity: 0, scaleX: 0.8, transformOrigin: "0% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.46, ease: "power3.out" }, 0.85);
      tl.fromTo(".f06-resistance-taglabel", { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power3.out" }, 0.98);
      tl.fromTo(".f06-resistance-tagroman",
        { opacity: 0, scale: 1.22, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 1.08);
      tl.fromTo(".f06-resistance-nailrule",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.42, ease: "power3.out" }, 1.32);
      tl.fromTo(".f06-resistance-nailhead", { opacity: 0, y: -26 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 1.4);

      /* Scene 2 (1.6-2.4s) - the seam drops and the second effect lands on the right:
         two effects, side by side. */
      tl.fromTo(".f06-resistance-divider",
        { scaleY: 0, transformOrigin: "50% 0%" },
        { scaleY: 1, duration: 0.56, ease: "power3.out" }, 1.6);
      tl.fromTo(".f06-resistance-fxbox", { opacity: 0, x: 56 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 1.9);
      tl.fromTo(".f06-resistance-fxname", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 2.15);
      tl.fromTo(".f06-resistance-lvcap", { opacity: 0 },
        { opacity: 1, duration: 0.36, ease: "power3.out" }, 2.32);
      tl.fromTo(".f06-resistance-fxtag", { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.42);

      /* Scene 3 (2.4-5.4s) - the right numeral keeps ticking (I -> II -> III -> IV) while the
         left tag never moves again: one follows the level, one does not. */
      var tick = [
        { t: 2.5,  num: ".f06-resistance-lv-1", cell: ".f06-resistance-fill-1", heart: ".f06-resistance-heart-1" },
        { t: 3.25, num: ".f06-resistance-lv-2", cell: ".f06-resistance-fill-2", heart: ".f06-resistance-heart-2" },
        { t: 4.0,  num: ".f06-resistance-lv-3", cell: ".f06-resistance-fill-3", heart: ".f06-resistance-heart-3" },
        { t: 5.4,  num: ".f06-resistance-lv-4", cell: ".f06-resistance-fill-4", heart: ".f06-resistance-heart-4" }
      ];
      var prevNum = null;
      tick.forEach(function (b) {
        if (prevNum) {
          tl.fromTo(prevNum,
            { opacity: 1, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" },
            { opacity: 0, scale: 1.26, filter: "blur(7px)", duration: 0.32, ease: "power3.out", immediateRender: false }, b.t);
        }
        tl.fromTo(b.num,
          { opacity: 0, scale: 0.84, filter: "blur(12px)", transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.38, ease: "power3.out" }, b.t);
        tl.fromTo(b.cell, { scaleY: 0, transformOrigin: "50% 100%" },
          { scaleY: 1, duration: 0.34, ease: "power3.out" }, b.t + 0.06);
        tl.fromTo(b.heart,
          { opacity: 0, scale: 0.55, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" }, b.t + 0.04);
        prevNum = b.num;
      });

      /* Scene 4 (5.1-6.5s) - the payoff: 40% lands on the fixed side while the right side
         is still ticking; the locked side then stops dead. */
      tl.fromTo(".f06-resistance-num", { opacity: 0, y: 36 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.1);
      tl.fromTo(".f06-resistance-numlabel", { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.6);

      /* Scene 5 (6.1-8.0s) - held read: the right column keeps settling, the left is frozen. */
      tl.fromTo(".f06-resistance-lvstack", { y: 9 },
        { y: 0, duration: 1.5, ease: "power3.out" }, 6.1);
      tl.fromTo(".f06-resistance-undersweep",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.5, ease: "power3.out" }, 6.4);
      tl.fromTo(".f06-resistance-qr",
        { opacity: 0, scale: 0.7, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 6.4);

      /* furniture */
      tl.fromTo(".f06-resistance-glitch", { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power3.out" }, 0.9);
      tl.fromTo(".f06-resistance-glitch", { backgroundPositionY: "0px" },
        { backgroundPositionY: "-1.5cqw", duration: 1.7, ease: "none" }, 6.2);
      tl.fromTo(".f06-resistance-kicker", { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.14);
      tl.fromTo(".f06-resistance-page", { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.72);

      window.__timelines["06-resistance"] = tl;
    })();
  </script>
